 const w=cv.parentNode.clientWidth;if(!w)return false;const fit=cv.dataset.fit==='1',side=fit?w:w*1.6,dpr=Math.min(2,window.devicePixelRatio||1),n=Math.max(16,Math.round(side*dpr)),k=n/160;

 g.save();g.translate(PF.M,PF.M);PF.setQ(side<110,k);try{PF.draw(g,+cv.dataset.l,PFA.reduced?1.3:ts/1000)}catch(e){document.documentElement.dataset.pferr=String(e&&e.message||e).slice(0,120)}g.restore();return true}

 const all=document.getElementsByClassName('pfc');if(!all.length)return;const t0=performance.now(),rescan=force||ts-PFA.vq>300;if(rescan)PFA.vq=ts;
 let budget=force?99:6;const vh=window.innerHeight||800,vw=window.innerWidth||400;

function rpos(d){for(let i=0;i<RSEG.length;i++){if(d<=RSEG[i]||i===RSEG.length-1){const u=clamp(d/RSEG[i],0,1),a=RP[i],b=RP[i+1];return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,Math.atan2(b[0]-a[0],-(b[1]-a[1]))]}d-=RSEG[i]}}
const TR=[];let trT=null,spawnCD=1.5,lastWasTO=true;
function newPlane(){const ti=Math.floor(Math.random()*5),pi=Math.floor(Math.random()*5),M=TERMS[ti].planes[pi],s=Math.min(1.25,30/M.sp,38/M.L);return{ti,pi,s,len:M.L*s,d:0,ph:'land',v:120,a:-Math.PI/2,x:720,y:RY,lift:1,to:0}}
function rwBusy(){return TR.some(p=>p.ph==='land'||p.ph==='to')}
function angLerp(a,b,k){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*k}
function stepTraffic(dt){
 // takeoffs
 for(const p of TR)if(p.ph==='to'){if(!p.lined){if(p.x<XE){p.x=Math.min(XE,p.x+14*dt);p.a=angLerp(p.a,Math.PI/2,Math.min(1,dt*4))}else{p.a=angLerp(p.a,Math.PI,Math.min(1,dt*3));p.y=Math.min(RY,p.y+14*dt);if(p.y>=RY){p.lined=1;p.v=0}}continue}
  p.a=angLerp(p.a,-Math.PI/2,Math.min(1,dt*2.5));if(Math.abs(angLerp(p.a,-Math.PI/2,1)-p.a)>.02&&p.v<4){continue}p.v=Math.min(150,p.v+34*dt);p.x-=p.v*dt;if(p.x<200)p.lift=Math.min(1,(200-p.x)/200)}
 for(let i=TR.length-1;i>=0;i--)if(TR[i].ph==='to'&&TR[i].x<-160)TR.splice(i,1);
 // ground movers ordered front (largest d) to back
 const G=TR.filter(p=>p.ph!=='to').sort((a,b)=>b.d-a.d);
 for(let i=0;i<G.length;i++){const p=G[i],ld=i?G[i-1]:null;let vt;
  if(p.ph==='land'){const x=RP[0][0]-p.d;vt=x>300?120:Math.max(14,14+(x-XW-20)*.45);p.lift=x>330?Math.min(1,(x-330)/260):0}else vt=16;
  p.v+= (vt-p.v)*Math.min(1,dt*(p.ph==='land'?1.6:2));let nd=p.d+p.v*dt;
  const LU=TR.find(q=>q.ph==='to'&&(q.y<RY-.5||q.x>XE-90));const lead=ld||(LU?{d:D_HOLD,len:LU.len+24}:null);
  if(lead){const lim=lead.d-(lead.len+p.len)/2-10;if(nd>lim){nd=Math.max(p.d,lim);p.v=Math.min(p.v,20)}}
  if(p.ph==='hold'){nd=p.d;p.v=0}else if(nd>=D_HOLD){nd=D_HOLD;p.ph='hold';p.v=0}
  if(p.ph==='land'&&nd>D_EXIT+p.len)p.ph='taxi';
  p.d=nd;const[x,y,a]=rpos(p.d);p.x=x;p.y=y;p.a=angLerp(p.a,a,Math.min(1,dt*4))}
 // runway control
 spawnCD-=dt;const hold=TR.find(p=>p.ph==='hold');const busy=rwBusy();
 if(!busy&&spawnCD<=0){
  const queueTail=G.length?G[G.length-1]:null,room=!queueTail||queueTail.d>D_EXIT+70,nGround=G.length;
  if(hold&&(lastWasTO===false||!room||nGround>=5||Math.random()<.5)){hold.ph='to';hold.v=0;lastWasTO=true;spawnCD=1.2+Math.random()*1.5}
  else if(room&&nGround<5){TR.push(newPlane());lastWasTO=false;spawnCD=1.5+Math.random()*2}
  else spawnCD=.5}}
function drawTraffic(g,t){const n=performance.now()/1000,dt=trT==null?0:Math.min(.1,n-trT);trT=n;if(TFIX==null)stepTraffic(dt);
 for(const p of TR){const k=1+.55*p.lift;if(p.lift>0){g.save();g.globalAlpha=.25*(1-p.lift*.5);g.fillStyle='#000';g.translate(p.x+14*p.lift,p.y+18*p.lift);g.rotate(p.a);g.beginPath();g.ellipse(0,p.len/2,TERMS[p.ti].planes[p.pi].sp*p.s*.35,p.len*.45,0,0,6.3);g.fill();g.restore()}
  g.save();g.translate(p.x,p.y);g.scale(k,k);const off=p.ph==='to'||p.ph==='land'?(p.ph==='to'?-p.len*.5:-p.len*.5):-p.len*.5;
  // plane origin is its nose: shift so (x,y) is the plane centre
  g.rotate(p.a);drawPlane(g,p.ti,p.pi,0,off,0,p.s,t);g.restore()}}
// prewarm so traffic is already flowing on load
for(let i=0;i<1400;i++)stepTraffic(1/20);
// ================= main terminal (landside processor) shared by T1-T5 =================
// Spans the top of the map (runway/taxiways are at the bottom, so ambient traffic never crosses it).
// The current terminal's connector is the walkway down to the satellite; the others leave as airside corridors toward their own satellites.
const MB={x:6,y:4,w:400,h:44};
function drawMain(g,ti,cx,cy,t){const T=TERMS[ti],y0=MB.y+MB.h,CY=56;
 // airside corridors along the building's airside face, leading off-map toward the other terminals' satellites
 for(const side of[-1,1]){const ids=[0,1,2,3,4].filter(i=>side<0?i<ti:i>ti);if(!ids.length)continue;
  const x0=side<0?-6:cx+14,x1=side<0?cx-14:418,yy=y0+2;
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x0+2,yy+3,x1-x0,11);roofRect(g,x0,yy,x1-x0,11,3);
  g.strokeStyle=K.glass;g.lineWidth=1.6;for(let x=x0+4;x<x1-4;x+=10){g.beginPath();g.moveTo(x,yy+10);g.lineTo(x+6,yy+10);g.stroke()}
  // chevrons pointing off-map
  g.fillStyle='#8aa0c0';for(let k=0;k<3;k++){const ax=side<0?12+k*7:400-k*7;g.beginPath();g.moveTo(ax+side*3,yy+5.5);g.lineTo(ax-side*2,yy+2);g.lineTo(ax-side*2,yy+9);g.closePath();g.fill()}
  // labels
  const lab=ids.map(i=>TERMS[i].short+(i<ST.term?'':'🔒')).join(' · '),lx=side<0?(x0+x1)/2+8:(x0+x1)/2-8;
  g.save();g.font='800 8px system-ui,sans-serif';const w=g.measureText(lab).width+12;rrect(g,lx-w/2,yy+14,w,13,6.5);g.fillStyle='#0b1220e0';g.fill();g.strokeStyle='#46557a';g.lineWidth=1;g.stroke();
  g.fillStyle='#cdd6e6';g.textAlign='center';g.textBaseline='middle';g.fillText((side<0?'◀ ':'')+lab+(side>0?' ▶':''),lx,yy+20.8);g.restore()}
 // building shadow + body
 g.save();g.fillStyle='rgba(0,0,0,.38)';rrect(g,MB.x+3,MB.y+4,MB.w,MB.h,9);g.fill();
 rrect(g,MB.x,MB.y,MB.w,MB.h,9);g.fillStyle=K.roof;g.fill();g.clip();
 // roof ribs
 g.strokeStyle=K.rib;g.lineWidth=1;for(let x=MB.x+10;x<MB.x+MB.w;x+=12){g.beginPath();g.moveTo(x,MB.y);g.lineTo(x,MB.y+MB.h);g.stroke()}
 // glass barrel skylights (check-in hall look)
 for(const [x0,x1] of [[MB.x+14,cx-40],[cx+40,MB.x+MB.w-14]]){const gr=g.createLinearGradient(0,MB.y+12,0,MB.y+30);gr.addColorStop(0,'#5d8fc4');gr.addColorStop(.5,'#9cc8f0');gr.addColorStop(1,'#3d6a9e');
  rrect(g,x0,MB.y+13,x1-x0,16,8);g.fillStyle=gr;g.fill();g.strokeStyle='#2a3a58';g.lineWidth=.8;for(let x=x0+6;x<x1;x+=7){g.beginPath();g.moveTo(x,MB.y+13);g.lineTo(x,MB.y+29);g.stroke()}
  g.strokeStyle='rgba(255,255,255,.35)';g.beginPath();g.moveTo(x0+4,MB.y+17);g.lineTo(x1-4,MB.y+17);g.stroke()}
 // airside glazing along the bottom facade
 g.strokeStyle=K.glass;g.lineWidth=2.4;for(let x=MB.x+6;x<MB.x+MB.w-6;x+=11){g.beginPath();g.moveTo(x,MB.y+MB.h-1.5);g.lineTo(x+7,MB.y+MB.h-1.5);g.stroke()}
 g.restore();g.strokeStyle=K.edge;g.lineWidth=2;rrect(g,MB.x,MB.y,MB.w,MB.h,9);g.stroke();
 // central hub with the label
 g.save();rrect(g,cx-36,MB.y+6,72,32,8);g.fillStyle='#22304d';g.fill();g.strokeStyle=T.acc;g.lineWidth=1.5;g.stroke();
 g.fillStyle='#e6edf7';g.font='900 9px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('MAIN TERMINAL',cx,MB.y+17);
 g.fillStyle='#8aa0c0';g.font='700 7px system-ui,sans-serif';g.fillText('CHECK-IN · SECURITY',cx,MB.y+28);g.restore();
 // highlighted connector: walkway from the main terminal to this satellite
 const wy=y0-2,wh=cy-60-wy+2;g.fillStyle='rgba(0,0,0,.35)';g.fillRect(cx-6,wy+4,16,wh);roofRect(g,cx-8,wy,16,wh,3,{vert:1});
 g.save();g.strokeStyle=T.acc;g.lineWidth=2;g.globalAlpha=.6+.25*pulse(t);g.strokeRect(cx-8,wy,16,wh);g.restore();
 g.save();rrect(g,cx+12,wy+40,30,13,6);g.fillStyle='#0b1220e0';g.fill();g.strokeStyle=T.acc;g.lineWidth=1.2;g.stroke();g.fillStyle='#e6edf7';g.font='800 8px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(T.short+' ▼',cx+27,wy+46.5);g.restore()}

setup();if(TFIX==null)requestAnimationFrame(frame);
(function loop(ts){pfTick(ts);requestAnimationFrame(loop)})(performance.now());
const P0=qs.get('pop');if(P0){const[t,gi]=P0.includes('.')?P0.split('.').map(Number):[ST.cur,+P0];setTimeout(()=>{openPop(t,gi-1);if(TFIX!=null)frame()},50)}
addEventListener('resize',()=>{fit();if(TFIX!=null)frame()});
</script>
